# DiskHog - one container per host, LAN only.
# This is the PROD compose: it pulls the prebuilt image that CI
# publishes to GHCR on every push to main
# (ghcr.io/pete1450/disk-hog:latest - see .github/workflows/build.yml).
#
# Run from this directory:
#   docker compose up -d
# Then open: http://<host-lan-ip>:8081
#
# To build the image yourself instead, see "Building the image
# yourself" in the README (docker-compose.dev.yml override).
#
# Why this is privileged (and why that is the whole point):
#   /:/host:rw lets the container walk the host filesystem and,
#   when you click a cleanup button, delete/truncate the file you
#   picked. Without it the app can only see itself.
#   The guard is in the app, not the mount: a hard blocklist
#   refuses /, /etc, /usr, /var/lib/docker itself and friends,
#   and every delete asks you to confirm. For a read-only view,
#   change this mount to :ro and set ENABLE_CLEANUP=0 below.
#   /var/run/docker.sock:ro lets it ask Docker for image /
#   container / volume / build-cache sizes (docker system df).
#   pid: host is NOT needed - DiskHog reads disk, not processes.
#
# Cleanup is ON here (ENABLE_CLEANUP=1) so the buttons work.
# There is no login in v1. Do NOT expose port 8081 to the internet.
# Keep it on LAN / VPN, or put it behind a reverse proxy with auth.
#
# Exclusions: EXCLUDE_PATHS is a comma-separated list of host paths
# the scan skips entirely (never walked, counted, or shown).
# /mnt is excluded here by default - add whatever you need, e.g.
#   - EXCLUDE_PATHS=/mnt,/media,/srv/backups
# /proc, /sys, /dev and /run are always skipped on top of this.
# You can also change exclusions live from the UI (Apply & rescan),
# but those only last until the container restarts - this setting
# is the permanent one. Restart after changing it: docker compose up -d.
#
# Note: apt clean and journal vacuum only work when DiskHog runs
# directly on the host (python3 app.py) - inside the container
# those buttons tell you the host command to run instead, because
# the container's apt/journal are not the host's.

services:
  diskhog:
    image: ghcr.io/pete1450/disk-hog:latest
    pull_policy: always
    container_name: diskhog
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - HOST_ROOT=/host
      - PORT=8081
      - ENABLE_CLEANUP=1
      - SCAN_TIMEOUT=300
      - EXCLUDE_PATHS=/mnt
    volumes:
      - /:/host:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
